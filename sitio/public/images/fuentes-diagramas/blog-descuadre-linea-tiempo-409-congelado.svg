<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Liberation Sans, Arial, sans-serif">
  <rect width="1600" height="900" fill="#FAFAF8"/>

  <text x="800" y="66" text-anchor="middle" font-size="22" letter-spacing="3" fill="#6E6E6D" font-weight="700">LA NOCHE DEL EVENTO, HORA POR HORA</text>

  <!-- y axis labels -->
  <text x="150" y="228" text-anchor="end" font-size="26" fill="#6E6E6D" font-weight="700">409</text>
  <text x="150" y="628" text-anchor="end" font-size="26" fill="#6E6E6D" font-weight="700">0</text>
  <line x1="170" y1="220" x2="1460" y2="220" stroke="#EDEBE4" stroke-width="2"/>
  <line x1="170" y1="620" x2="1460" y2="620" stroke="#EDEBE4" stroke-width="2"/>

  <!-- legend -->
  <line x1="960" y1="130" x2="1010" y2="130" stroke="#E8A838" stroke-width="8" stroke-linecap="round"/>
  <text x="1022" y="137" font-size="22" fill="#1A1A1A" font-weight="700">total del producto (congelado)</text>
  <line x1="960" y1="166" x2="1010" y2="166" stroke="#1A1A1A" stroke-width="5" stroke-dasharray="9 8" stroke-linecap="round"/>
  <text x="1022" y="173" font-size="22" fill="#4A4A4A">detalle por talla (lo real)</text>

  <!-- amber flat line: total congelado -->
  <path d="M300,220 L1300,220" fill="none" stroke="#E8A838" stroke-width="10" stroke-linecap="round"/>

  <!-- gray dashed line: detalle por talla, overlaps then steps down -->
  <path d="M300,220 L950,220 L1010,220 L1010,340 L1090,340 L1090,460 L1170,460 L1170,540 L1240,540 L1240,620 L1300,620"
        fill="none" stroke="#1A1A1A" stroke-width="6" stroke-dasharray="10 9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- divergence marker -->
  <circle cx="950" cy="220" r="10" fill="#FAFAF8" stroke="#4A4A4A" stroke-width="3"/>
  <path d="M958,232 L1170,270" fill="none" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="1180" y="277" text-anchor="start" font-size="20" fill="#4A4A4A">aqu&#237; se separan las dos l&#237;neas</text>

  <!-- hito markers on the amber line + axis -->
  <g>
    <circle cx="300" cy="220" r="11" fill="#E8A838"/>
    <circle cx="600" cy="220" r="11" fill="#E8A838"/>
    <circle cx="950" cy="220" r="11" fill="#E8A838"/>
    <circle cx="1300" cy="220" r="11" fill="#E8A838"/>
  </g>

  <!-- vertical guides to axis -->
  <g stroke="#D4D4D4" stroke-width="2" stroke-dasharray="5 6">
    <line x1="300" y1="220" x2="300" y2="700"/>
    <line x1="600" y1="220" x2="600" y2="700"/>
    <line x1="950" y1="220" x2="950" y2="700"/>
    <line x1="1300" y1="220" x2="1300" y2="700"/>
  </g>
  <line x1="170" y1="700" x2="1460" y2="700" stroke="#1A1A1A" stroke-width="3"/>

  <!-- hito labels -->
  <g font-family="Liberation Sans, Arial, sans-serif">
    <text x="300" y="736" text-anchor="middle" font-size="28" font-weight="700" fill="#1A1A1A">13:59</text>
    <text x="300" y="766" text-anchor="middle" font-size="21" fill="#4A4A4A">llega la</text>
    <text x="300" y="790" text-anchor="middle" font-size="21" fill="#4A4A4A">mercanc&#237;a</text>

    <text x="600" y="736" text-anchor="middle" font-size="28" font-weight="700" fill="#1A1A1A">14:18</text>
    <text x="600" y="766" text-anchor="middle" font-size="21" fill="#4A4A4A">sale por</text>
    <text x="600" y="790" text-anchor="middle" font-size="21" fill="#4A4A4A">transferencia</text>

    <text x="950" y="736" text-anchor="middle" font-size="28" font-weight="700" fill="#1A1A1A">17:57</text>
    <text x="950" y="766" text-anchor="middle" font-size="21" fill="#4A4A4A">empiezan</text>
    <text x="950" y="790" text-anchor="middle" font-size="21" fill="#4A4A4A">las ventas</text>

    <text x="1300" y="736" text-anchor="middle" font-size="28" font-weight="700" fill="#1A1A1A">21:31</text>
    <text x="1300" y="766" text-anchor="middle" font-size="21" fill="#4A4A4A">el cliente graba</text>
    <text x="1300" y="790" text-anchor="middle" font-size="21" fill="#4A4A4A">el video</text>
  </g>

  <!-- end callouts -->
  <rect x="1330" y="192" width="150" height="56" rx="12" fill="#FDF3DF"/>
  <text x="1405" y="227" text-anchor="middle" font-size="26" font-weight="700" fill="#9A6B10">409</text>

  <rect x="1330" y="592" width="150" height="56" rx="12" fill="#F5F3EE"/>
  <text x="1405" y="627" text-anchor="middle" font-size="26" font-weight="700" fill="#4A4A4A">0</text>

  <text x="800" y="850" text-anchor="middle" font-size="20" fill="#6E6E6D">horas ilustrativas, sin escala &#8212; lo que importa es el orden de los hechos</text>
</svg>
